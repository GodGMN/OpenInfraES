<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infraestructura de España — OpenInfraES</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --fondo:#05080d; --panel:rgba(8,13,21,.88); --panel-solido:#0a1119;
    --borde:rgba(125,155,180,.16); --borde-fuerte:rgba(34,211,238,.45);
    --tinta:#e8f2f9; --suave:#93a9bd; --tenue:#63788c;
    --cian:#22d3ee; --ambar:#fbbf24;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  }
  html[data-tema="claro"] {
    --fondo:#eef2f6; --panel:rgba(255,255,255,.95); --panel-solido:#fff;
    --borde:rgba(15,28,46,.14); --borde-fuerte:rgba(8,145,178,.5);
    --tinta:#0d1a29; --suave:#4a5c70; --tenue:#7b8ea3;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--fondo);
    font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif; color:var(--tinta); }
  #mapa { position:absolute; inset:0; background:var(--fondo); }

  /* El IGN gris solo viene en claro. En vez de invertirlo (que aplasta la geografía
     y deja el mapa en negro sin costas) se desatura y se oscurece: queda una base
     legible en grises oscuros sobre la que los datos neón sí destacan. */
  /* cada base trae su filtro: el IGN no tiene teselas oscuras, así que el look se hace aquí */
  html[data-base="radar"] .leaflet-tile-pane { filter:invert(1) brightness(2.15) contrast(1.22) saturate(0); }
  html[data-base="gris"]  .leaflet-tile-pane { filter:grayscale(1) brightness(.42) contrast(1.55); }
  html[data-tema="oscuro"][data-base="todo"] .leaflet-tile-pane,
  html[data-tema="oscuro"][data-base="orto"] .leaflet-tile-pane { filter:brightness(.62) contrast(1.15) saturate(.75); }
  html[data-tema="claro"][data-base="todo"] .leaflet-tile-pane,
  html[data-tema="claro"][data-base="orto"] .leaflet-tile-pane,
  html[data-tema="claro"][data-base="osm"] .leaflet-tile-pane { filter:none; }
  html[data-tema="oscuro"][data-base="osm"] .leaflet-tile-pane { filter:grayscale(1) invert(1) brightness(.75) contrast(1.2); }
  .leaflet-tile-pane { transition:filter .4s ease; }
  .leaflet-container { background:var(--fondo); font-family:inherit; }

  #hud { position:absolute; z-index:1000; top:16px; left:16px; width:330px;
    max-height:calc(100% - 92px); display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--borde); border-radius:3px;
    backdrop-filter:blur(10px); box-shadow:0 20px 55px rgba(0,0,0,.6); }
  #hud::before { content:""; position:absolute; top:-1px; left:16px; right:16px; height:1px;
    background:linear-gradient(90deg,transparent,var(--borde-fuerte),transparent); }
  #cabeza { padding:15px 16px 12px; border-bottom:1px solid var(--borde); }
  .marca { display:flex; align-items:center; gap:9px; }
  .punto-vivo { width:6px; height:6px; border-radius:50%; background:var(--cian);
    box-shadow:0 0 0 3px rgba(34,211,238,.15); animation:latido 2.6s ease-in-out infinite; }
  @keyframes latido { 0%,100%{opacity:1} 50%{opacity:.3} }
  #cabeza h1 { margin:0; font-size:13px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; }
  #cabeza .sub { color:var(--suave); font-size:10.8px; letter-spacing:.06em; margin-top:6px;
    font-family:var(--mono); text-transform:uppercase; }
  .acciones-hud { position:absolute; top:14px; right:14px; display:flex; gap:4px; }
  #btn-tema { width:26px; height:26px;
    border:1px solid var(--borde); background:transparent; color:var(--suave); border-radius:2px;
    cursor:pointer; font-size:12px; display:grid; place-items:center; transition:.15s; }
  #btn-tema:hover, #btn-fuentes:hover, #btn-enlace:hover, #btn-estado:hover { color:var(--cian); border-color:var(--borde-fuerte); }
  #btn-fuentes, #btn-enlace, #btn-estado { width:26px; height:26px; border:1px solid var(--borde);
    background:transparent; color:var(--suave); border-radius:2px; cursor:pointer; font-size:12px;
    display:grid; place-items:center; }

  #presets { display:flex; flex-wrap:wrap; gap:4px; padding:9px 15px 0; }
  #presets button { flex:1 1 auto; min-width:0; border:1px solid var(--borde); background:transparent;
    color:var(--suave); border-radius:2px; padding:4px 6px; font-family:var(--mono); font-size:9.4px;
    letter-spacing:.09em; text-transform:uppercase; cursor:pointer; transition:.15s; }
  #presets button:hover { color:var(--cian); border-color:var(--borde-fuerte); }
  #presets button.on { color:var(--fondo); background:var(--cian); border-color:var(--cian); font-weight:600; }
  #capas { overflow:auto; padding:10px 5px 10px 15px; flex:1; }
  #capas::-webkit-scrollbar { width:5px; }
  #capas::-webkit-scrollbar-thumb { background:var(--borde-fuerte); border-radius:3px; }
  .grupo { margin:0 0 12px; }
  .grupo-t { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:9.8px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--suave); margin:0 0 6px; }
  .grupo-t::after { content:""; flex:1; height:1px; background:var(--borde); }
  .fila { display:flex; align-items:center; gap:9px; padding:4.2px 7px 4.2px 3px; cursor:pointer;
    border-radius:2px; transition:background .12s; }
  .fila:hover { background:rgba(34,211,238,.07); }
  .fila input { appearance:none; width:12px; height:12px; border:1px solid var(--tenue);
    border-radius:1px; flex:0 0 auto; cursor:pointer; position:relative; transition:.15s; }
  .fila input:checked { border-color:var(--cian); background:var(--cian);
    box-shadow:0 0 8px rgba(34,211,238,.6); }
  .fila input:checked::after { content:""; position:absolute; inset:2.5px; background:var(--fondo); }
  .muestra { width:14px; height:3px; border-radius:1px; flex:0 0 auto; }
  .muestra.pol { height:10px; background:transparent !important; border:1px solid; }
  .fila .txt { font-size:12.5px; }
  .fila .n { margin-left:auto; font-family:var(--mono); font-size:10.8px; color:var(--tenue);
    font-variant-numeric:tabular-nums; }
  .fila.activa .n { color:var(--cian); }

  #pie { border-top:1px solid var(--borde); padding:10px 15px 11px; }
  #pie select { width:100%; background:transparent; color:var(--tinta);
    border:1px solid var(--borde); border-radius:2px; padding:6px 8px; font-family:var(--mono);
    font-size:10.8px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  #pie select option { background:var(--panel-solido); color:var(--tinta); }

  #estado { position:absolute; z-index:1000; bottom:14px; left:16px; right:16px; height:30px;
    display:flex; align-items:center; gap:16px; padding:0 14px; background:var(--panel);
    border:1px solid var(--borde); border-radius:2px; backdrop-filter:blur(10px);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; color:var(--suave);
    text-transform:uppercase; }
  #estado b { color:var(--tinta); font-weight:500; }
  #estado .sep { width:1px; height:13px; background:var(--borde); }
  #estado .der { margin-left:auto; display:flex; gap:14px; align-items:center; }

  .leaflet-popup-content-wrapper { background:var(--panel-solido); color:var(--tinta);
    border:1px solid var(--borde-fuerte); border-radius:3px;
    box-shadow:0 22px 60px rgba(0,0,0,.65); }
  .leaflet-popup-tip { background:var(--panel-solido); border:1px solid var(--borde-fuerte); }
  .leaflet-popup-content { margin:0; width:302px !important; font-size:12.4px; line-height:1.45; }
  .leaflet-popup-close-button { color:var(--suave) !important; font-size:20px !important;
    width:27px !important; height:27px !important; }
  .ficha { padding:14px 15px 15px; }
  .ficha .ft { font-size:14.5px; font-weight:600; line-height:1.25; padding-right:16px; }
  .ficha .fs { font-family:var(--mono); font-size:9.8px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--cian); margin:6px 0 10px; }
  .ficha .fd { margin:0 0 10px; color:var(--suave); font-size:11.8px; }
  .ficha table { width:100%; border-collapse:collapse; font-size:11.7px; }
  .ficha td { padding:3.2px 0; vertical-align:top; border-bottom:1px solid var(--borde); }
  .ficha tr:last-child td { border-bottom:0; }
  .ficha td.k { color:var(--suave); width:45%; padding-right:8px; }
  .ficha td.v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.4px; }
  .caudal { margin-top:11px; border-top:1px solid var(--borde); padding-top:9px; }
  .caudal .cv { font-family:var(--mono); font-size:19px; color:var(--cian); font-variant-numeric:tabular-nums; }
  .caudal .cv small { font-size:11px; color:var(--suave); margin-left:4px; }
  .caudal .cl { font-family:var(--mono); font-size:9.4px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--tenue); margin-bottom:3px; }
  .caudal .spark { display:flex; align-items:flex-end; gap:2px; height:34px; margin-top:8px; }
  .caudal .spark i { flex:1; background:var(--cian); opacity:.55; border-radius:1px 1px 0 0; min-height:2px; }
  .caudal .spark i.hoy { opacity:1; box-shadow:0 0 8px rgba(34,211,238,.7); }
  .caudal .cf { font-size:10.4px; color:var(--tenue); margin-top:6px; line-height:1.45; }
  .caudal .err { font-size:11px; color:var(--ambar); }
  .ficha .links { margin-top:11px; display:flex; flex-wrap:wrap; gap:5px; }
  .ficha .links a { border:1px solid var(--borde-fuerte); border-radius:2px; padding:3px 9px;
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--cian); text-decoration:none; }
  .ficha .links a:hover { background:rgba(34,211,238,.13); }
  .ficha ul { margin:6px 0 0; padding-left:15px; font-size:11.4px; color:var(--suave); }
  .ficha ul li { margin-bottom:2px; }


  /* ---------- buscador ---------- */
  #buscar { display:flex; gap:6px; padding:9px 15px 0; }
  #buscar input { flex:1; min-width:0; background:rgba(255,255,255,.04); color:var(--tinta);
    border:1px solid var(--borde); border-radius:2px; padding:6px 9px; font-size:12px;
    font-family:inherit; }
  #buscar input::placeholder { color:var(--tenue); }
  #buscar input:focus { outline:none; border-color:var(--borde-fuerte); }
  #resultados { position:absolute; top:96px; left:15px; right:15px; z-index:5; background:var(--panel-solido);
    border:1px solid var(--borde-fuerte); border-radius:2px; max-height:230px; overflow:auto; display:none; }
  #resultados.on { display:block; }
  #resultados div { padding:6px 9px; font-size:11.8px; cursor:pointer; border-bottom:1px solid var(--borde); }
  #resultados div:hover { background:rgba(34,211,238,.1); }
  #resultados div span { display:block; font-family:var(--mono); font-size:9.4px;
    text-transform:uppercase; letter-spacing:.1em; color:var(--tenue); margin-top:2px; }

  /* ---------- modal fuentes ---------- */
  #velo { position:fixed; inset:0; z-index:2000; background:rgba(3,6,10,.78); display:none;
    align-items:center; justify-content:center; padding:24px; }
  #velo.on { display:flex; }
  #fuentes { width:min(980px,100%); max-height:86vh; overflow:auto; background:var(--panel-solido);
    border:1px solid var(--borde-fuerte); border-radius:3px; padding:20px 22px;
    box-shadow:0 30px 90px rgba(0,0,0,.7); }
  #fuentes h2 { margin:0 0 3px; font-size:15px; letter-spacing:.1em; text-transform:uppercase; }
  #fuentes .nota { color:var(--suave); font-size:11.6px; margin-bottom:14px; line-height:1.5; }
  #fuentes table { width:100%; border-collapse:collapse; font-size:11.6px; }
  #fuentes th { text-align:left; font-family:var(--mono); font-size:9.6px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--tenue); border-bottom:1px solid var(--borde-fuerte);
    padding:0 8px 6px 0; position:sticky; top:0; background:var(--panel-solido); }
  #fuentes td { padding:6px 8px 6px 0; border-bottom:1px solid var(--borde); vertical-align:top; }
  #fuentes td.c { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
  #fuentes a { color:var(--cian); text-decoration:none; }
  #fuentes .cerrar { float:right; background:transparent; border:1px solid var(--borde);
    color:var(--suave); border-radius:2px; width:26px; height:26px; cursor:pointer; }
  #fuentes .cerrar:hover { color:var(--cian); border-color:var(--borde-fuerte); }
  #fuentes .lic { font-family:var(--mono); font-size:10px; color:var(--suave); }
  #fuentes tbody tr.fila-f { cursor:pointer; }
  #fuentes tbody tr.fila-f:hover { background:rgba(34,211,238,.06); }
  #fuentes tr.det td { background:rgba(34,211,238,.04); padding:9px 10px 11px 14px; }
  #fuentes .cadena { font-size:11.4px; line-height:1.65; color:var(--suave); }
  #fuentes .cadena b { color:var(--tinta); font-weight:600; }
  #fuentes .cadena .fl { color:var(--cian); }
  #fuentes .cadena .nota { display:block; margin-top:5px; font-size:11px; color:var(--tenue); }

  #velo2 { position:fixed; inset:0; z-index:2000; background:rgba(3,6,10,.78); display:none;
    align-items:center; justify-content:center; padding:24px; }
  #velo2.on { display:flex; }
  #sis { width:min(680px,100%); max-height:86vh; overflow:auto; background:var(--panel-solido);
    border:1px solid var(--borde-fuerte); border-radius:3px; padding:20px 22px;
    box-shadow:0 30px 90px rgba(0,0,0,.7); }
  #sis h2 { margin:0 0 3px; font-size:15px; letter-spacing:.1em; text-transform:uppercase; }
  #sis .nota { color:var(--suave); font-size:12.2px; margin-bottom:16px; line-height:1.5; }
  #sis .cerrar { float:right; background:transparent; border:1px solid var(--borde); color:var(--suave);
    border-radius:2px; width:26px; height:26px; cursor:pointer; }
  .barra { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .barra .n { width:150px; font-size:11.8px; text-align:right; color:var(--suave); flex:0 0 auto; }
  .barra .b { height:15px; border-radius:1px; flex:0 0 auto; }
  .barra .v { font-family:var(--mono); font-size:10.6px; color:var(--tinta); white-space:nowrap; }
  .barra .p { font-family:var(--mono); font-size:10.2px; color:var(--tenue); }

  /* ---------- opacidad ---------- */
  #opacidad { display:flex; align-items:center; gap:8px; padding:8px 15px 0; }
  #opacidad label { font-family:var(--mono); font-size:9.4px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--tenue); }
  #opacidad input[type=range] { flex:1; min-width:0; accent-color:var(--cian); height:3px; }
  #opacidad b { font-family:var(--mono); font-size:10px; color:var(--suave); width:30px; text-align:right; }

  .leaflet-control-attribution { background:rgba(5,8,13,.75) !important; color:var(--tenue) !important;
    font-size:9.6px !important; }
  .leaflet-control-attribution a { color:var(--suave) !important; }
  .leaflet-bar { border:1px solid var(--borde) !important; border-radius:2px !important; }
  .leaflet-bar a { background:var(--panel-solido) !important; color:var(--tinta) !important;
    border-bottom-color:var(--borde) !important; width:29px !important; height:29px !important;
    line-height:29px !important; }
  .leaflet-bar a:hover { color:var(--cian) !important; }
</style>
</head>
<body>
<div id="mapa"></div>

<div id="hud">
  <div id="cabeza">
    <div class="marca"><span class="punto-vivo"></span><h1>Infraestructura España</h1></div>
    <div class="sub" id="sub-hud">—</div>
    <div class="acciones-hud">
      <button id="btn-estado" title="Generación del día (API REE)">⚡</button>
      <button id="btn-fuentes" title="Fuentes y fecha de los datos">ⓘ</button>
      <button id="btn-enlace" title="Copiar enlace a esta vista">⧉</button>
      <button id="btn-tema" title="Cambiar tema">◐</button>
    </div>
  </div>
  <div id="buscar"><input id="q" type="search" placeholder="Buscar instalación…" autocomplete="off"></div>
  <div id="resultados"></div>
  <div id="presets">
    <button data-preset="todos">Todo</button>
    <button data-preset="Red eléctrica">Eléctrico</button>
    <button data-preset="Gas">Gas</button>
    <button data-preset="Agua">Agua</button>
    <button data-preset="Transporte">Transporte</button>
  </div>
  <div id="capas"></div>
  <div id="opacidad"><label>Datos</label><input id="op" type="range" min="30" max="100" value="100"><b id="opv">100%</b></div>
  <div id="pie"><select id="base"></select></div>
</div>

<div id="velo"><div id="fuentes">
  <button class="cerrar" id="cerrar-fuentes">×</button>
  <h2>De dónde sale cada dato</h2>
  <div class="nota" id="fuentes-nota">Cargando…</div>
  <table><thead><tr><th>Capa</th><th>Fuente</th><th>Actualizado</th><th>Licencia</th><th class="c">Registros</th></tr></thead>
  <tbody id="fuentes-tabla"></tbody></table>
</div></div>

<div id="velo2"><div id="sis">
  <button class="cerrar" id="cerrar-sis">×</button>
  <h2>Generación del día</h2>
  <div class="nota" id="sis-nota">Cargando…</div>
  <div id="sis-barras"></div>
</div></div>

<div id="estado">
  <span>z <b id="s-zoom">6.6</b></span>
  <span class="sep"></span>
  <span><b id="s-coord">—</b></span>
  <span class="sep"></span>
  <span>capas <b id="s-capas">0</b></span>
  <span class="der"><span id="s-peso">—</span></span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const nf = n => (typeof n === "number" ? n.toLocaleString("es-ES", { maximumFractionDigits: 2 }) : n);

const IGN = (c, f) => "https://www.ign.es/wmts/ign-base?request=GetTile&service=WMTS&version=1.0.0&layer=" +
  c + "&style=default&tilematrixset=GoogleMapsCompatible&tilematrix={z}&tilerow={y}&tilecol={x}&format=" + f;
const BASES = {
  radar:          ["IGN radar (líneas)", IGN("IGNBaseTodo-nofondo", "image/png")],
  "IGNBase-gris": ["IGN gris",      IGN("IGNBase-gris", "image/png")],
  "IGNBaseTodo":  ["Mapa base IGN", IGN("IGNBaseTodo", "image/png")],
  "IGNBaseOrto":  ["Ortofoto PNOA", IGN("IGNBaseOrto", "image/jpeg")],
  "osm":          ["OpenStreetMap", "https://tile.openstreetmap.org/{z}/{x}/{y}.png"]
};

const mapa = L.map("mapa", {
  zoomControl: true, preferCanvas: true, minZoom: 5, maxZoom: 18,
  zoomSnap: 0.25, zoomDelta: 0.75, wheelPxPerZoomLevel: 90, wheelDebounceTime: 20,
  zoomAnimation: true, fadeAnimation: true, inertia: true, inertiaDeceleration: 2500,
  renderer: L.canvas({ padding: 0.45, tolerance: 17 })
}).setView([40.1, -3.7], 6.6);

let capaBase = null;
function ponerBase(k) {
  const [nombre, url] = BASES[k] || BASES["IGNBase-gris"];
  if (capaBase) mapa.removeLayer(capaBase);
  capaBase = L.tileLayer(url, {
    attribution: "© IGN · datos: OSM / REE / Atlas / MITMA",
    maxNativeZoom: 18, maxZoom: 19, crossOrigin: true,
    updateWhenIdle: false, keepBuffer: 4
  }).addTo(mapa);
  capaBase.bringToBack();
  document.documentElement.dataset.base = BASES[k] ? k : "radar";
}

/* ---------------- ficha ---------------- */
const OCULTAS = new Set(["slug","verif","id","fid","OBJECTID","objectid","claves","fuentes",
  "fecha_alta","nombre","name","descripcion","estado_registro","geo_fuente",
  "geo_precision","fecha_verificacion","categoria","tipo_osm"]);
const esTecnico = k => /(_v|_f|__v|__f)$/.test(k);
const ETIQ = { operador:"Operador", municipio:"Municipio", demarcacion:"Demarcación",
  capacidad_hm3:"Capacidad (hm³)", agua_actual_hm3:"Agua embalsada (hm³)", fecha_dato:"Fecha del dato",
  hidroelectrico:"Hidroeléctrico", tecnologia_normalized:"Tecnología", installed_capacity_mw:"Potencia (MW)",
  province:"Provincia", Carretera:"Carretera", Tipo_de_via:"Tipo de vía", Titular:"Titular",
  TENT:"Red TEN-T", Longitud:"Longitud (m)", Nombre_terminal:"Terminal", Tipo_terminal:"Tipo",
  Aeropuerto:"Aeropuerto", Direccion:"Dirección", Rotulo:"Rótulo", Venta_al_publico:"Venta al público",
  Coord1:"Longitud", Coord2:"Latitud", Valido_desde:"Válido desde", Hidrogeno:"Hidrógeno",
  Biodiesel:"Biodiésel", Gas_natural_licuado:"GNL", Gas_natural_comprimido:"GNC",
  Gases_licuados_del_petroleo:"GLP", Nombre_plataforma:"Plataforma", voltage:"Tensión (V)",
  operator:"Operador", circuits:"Circuitos", Elemento_portuario:"Elemento portuario" };

function ficha(p, c) {
  const titulo = p.nombre || p.name || p.Nombre || p.Nombre_terminal || p.Aeropuerto || p.Carretera ||
                 p.Rotulo || p.Direccion || p.Nombre_plataforma || "Sin nombre";
  const estado = [p.categoria, p.estado_registro, p.verif]
    .filter(v => v && !/^[A-Z0-9_]+$/.test(String(v))).join(" · ");
  let h = '<div class="ficha"><div class="ft">' + titulo + "</div>";
  h += '<div class="fs">' + c.label + (estado ? " — " + estado : "") + "</div>";
  if (p.descripcion) h += '<p class="fd">' + p.descripcion + "</p>";
  const filas = Object.entries(p).filter(([k, v]) =>
    v !== null && v !== "" && v !== undefined && !OCULTAS.has(k) && !esTecnico(k) && typeof v !== "object");
  if (filas.length) {
    h += "<table>";
    filas.slice(0, 15).forEach(([k, v]) => {
      let valor = v;
      if (typeof v === "boolean") valor = v ? "Sí" : "No";
      if (k === "hidroelectrico") valor = v ? "Sí" : "No";
      if (k === "voltage" && Number(v) > 1000) valor = (Number(v) / 1000) + " kV";
      if (typeof v === "number" && v > 1e11 && v < 3e12)
        valor = new Date(v).toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric" });
      h += '<tr><td class="k">' + (ETIQ[k] || k.replace(/_/g, " ")) + '</td><td class="v">' + nf(valor) + "</td></tr>";
    });
    h += "</table>";
  }
  const enlaces = [];
  if (p.slug && c.atlas) enlaces.push(["Atlas", "https://atlas.eltercioviejo.com/ficha/" + c.atlas + "/" + p.slug + "/"]);
  if (p.osm_id) enlaces.push(["OpenStreetMap", "https://www.openstreetmap.org/way/" + p.osm_id]);
  if (c.apiCaudal) h += '<div class="caudal" id="caudal-box"><div class="cl">Caudal</div>' +
    '<div class="err">consultando…</div></div>';
  if (enlaces.length) h += '<div class="links">' + enlaces.map(([t, u]) =>
    '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>").join("") + "</div>";
  return h + "</div>";
}

/* ficha de un grupo agregado: al alejar, un punto son N instalaciones */
function fichaGrupo(items, c) {
  const nombres = items.slice(0, 8).map(f => {
    const p = f.properties || {};
    return p.nombre || p.name || p.Nombre || p.Rotulo || p.Direccion || "sin nombre";
  });
  let h = '<div class="ficha"><div class="ft">' + items.length + " " + c.label.toLowerCase() + "</div>";
  h += '<div class="fs">' + c.label + " — agrupadas por zoom</div>";
  h += "<ul>" + nombres.map(n => "<li>" + n + "</li>").join("");
  if (items.length > 8) h += "<li>y " + (items.length - 8) + " más…</li>";
  h += "</ul><p class='fd' style='margin-top:8px;font-size:11px'>Acércate para verlas por separado.</p></div>";
  return h;
}

/* Caudal: Open-Meteo Flood (GloFAS), sin clave. Es MODELADO, no aforo oficial:
   el modelo reparte el agua en una malla de ~5 km, no mide en la presa. */
async function consultarCaudal(p) {
  const caja = document.getElementById("caudal-box");
  if (!caja) return;
  const pt = p.punto_aforo;
  if (!pt) { caja.innerHTML = '<div class="cl">Caudal</div><div class="err">sin punto de aforo</div>'; return; }
  try {
    const url = "https://flood-api.open-meteo.com/v1/flood?latitude=" + pt[1] + "&longitude=" + pt[0] +
                "&daily=river_discharge&past_days=7&forecast_days=2";
    const r = await fetch(url);
    const d = await r.json();
    const dias = d.daily.time, vals = d.daily.river_discharge;
    const hoy = new Date().toISOString().slice(0, 10);
    const iHoy = Math.max(0, dias.indexOf(hoy));
    const max = Math.max(...vals.filter(v => v != null), 0.1);
    const barras = vals.map((v, i) =>
      `<i style="height:${v == null ? 2 : Math.max(3, (v / max) * 34)}px" class="${dias[i] === hoy ? "hoy" : ""}" title="${dias[i]}: ${v == null ? "—" : v + " m³/s"}"></i>`).join("");
    caja.innerHTML = '<div class="cl">Caudal modelado (GloFAS)</div>' +
      `<div class="cv">${vals[iHoy] == null ? "—" : nf(vals[iHoy])}<small>m³/s hoy</small></div>` +
      `<div class="spark">${barras}</div>` +
      `<div class="cf">Modelo global, rejilla ~5 km · no es el aforo de la confederación. ` +
      `Punto: ${pt[1].toFixed(3)}, ${pt[0].toFixed(3)}</div>`;
  } catch (e) {
    caja.innerHTML = '<div class="cl">Caudal</div><div class="err">API no disponible ahora mismo</div>';
  }
}

const radioDe = (c, p) => {
  const rmin = c.radioMin || c.radio || 4.5, rmax = c.radioMax || 11;
  if (!c.magnitud) return rmin;
  return Math.max(rmin, Math.min(rmax, Math.sqrt(p[c.magnitud] || 0) / 1.6));
};

/* ---------- agregación propia por rejilla (sin plugin) ----------
   A zoom nacional 1.400 puntos hidráulicos son una mancha. Se agrupan en celdas
   cuyo tamaño crece al alejar; al acercarse (z>=8) cada punto se dibuja solo. */
function celda(z) {
  // calibrado para ~70 burbujas con 1.400 puntos a zoom nacional
  const grados = Math.pow(2, 9 - Math.floor(z)) * 0.045;
  return Math.max(0.06, Math.min(3, grados));
}

function pintarPuntos(c) {
  const feats = datos[c.id];
  if (!feats) return;
  c.__zPintado = mapa.getZoom();
  capas[c.id].clearLayers();
  elementos[c.id] = [];
  const z = mapa.getZoom();

  if (c.siempreIndividual || z >= ZOOM_DETALLE) {
    feats.forEach(f => {
      const [lng, lat] = f.geometry.coordinates;
      const p = f.properties || {};
      const m = L.circleMarker([lat, lng], {
        radius: radioDe(c, p), fillColor: c.color, fillOpacity: c.opacidad || .78,
        color: "#fff", weight: 1, opacity: .45
      });
      m.on("click", e => { abrirFicha(p, c, e.latlng); L.DomEvent.stopPropagation(e); });
      m.addTo(capas[c.id]);
      elementos[c.id].push(m);
    });
    return;
  }

  // agrupado: una burbuja por celda
  const g = celda(z), celdas = new Map();
  feats.forEach(f => {
    const [lng, lat] = f.geometry.coordinates;
    const k = Math.floor(lat / g) + ":" + Math.floor(lng / g);
    if (!celdas.has(k)) celdas.set(k, []);
    celdas.get(k).push(f);
  });
  celdas.forEach(items => {
    const lat = items.reduce((a, f) => a + f.geometry.coordinates[1], 0) / items.length;
    const lng = items.reduce((a, f) => a + f.geometry.coordinates[0], 0) / items.length;
    const n = items.length;
    const r = n === 1 ? radioDe(c, items[0].properties)
                      : Math.min(19, 6 + 3.1 * Math.log2(n + 1));
    const m = L.circleMarker([lat, lng], {
      radius: r,
      fillColor: c.color, fillOpacity: n === 1 ? (c.opacidad || .78) : .3,
      color: c.color, weight: n === 1 ? 1 : 1.6, opacity: n === 1 ? .45 : .95
    });
    m.on("click", e => {
      if (n === 1) abrirFicha(items[0].properties, c, e.latlng);
      else { POPUP.setLatLng(e.latlng).setContent(fichaGrupo(items, c)).openOn(mapa); }
      L.DomEvent.stopPropagation(e);
    });
    m.addTo(capas[c.id]);
    elementos[c.id].push(m);
  });
}

function cargar(c) {
  if (c.__cargada) return;
  c.__cargada = true;
  fetch(c.fichero)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(gj => {
      const feats = c.filtro ? gj.features.filter(c.filtro) : gj.features;
      conteo[c.id] = feats.length;
      const el = document.getElementById("n-" + c.id);
      if (el) el.textContent = nf(feats.length);
      document.querySelector('[data-fila="' + c.id + '"]').classList.add("activa");

      // indice para el buscador: nombre + coordenadas
      feats.forEach(f => {
        const p = f.properties || {};
        const nom = p.nombre || p.name || p.Nombre || p.Nombre_terminal || p.Rotulo ||
                    p.Direccion || p.Carretera;
        if (!nom) return;
        const g = f.geometry || {};
        let arr = null;
        if (g.type === "Point") arr = g.coordinates;
        else if (g.type === "LineString" && g.coordinates.length) arr = g.coordinates[0];
        if (!arr) return;
        INDICE.push({ nombre: String(nom), lat: arr[1], lng: arr[0], capa: c.id, props: p });
      });

      if (c.tipo === "punto") { datos[c.id] = feats; pintarPuntos(c); }
      else {
        // lineas y poligonos: halo debajo si se pide (solo 400/220 kV)
        if (c.halo) {
          L.geoJSON({ type:"FeatureCollection", features:feats }, {
            style: () => ({ color:"#0b1220", weight:c.halo, opacity:.85, fill:false })
          }).addTo(capas[c.id]);
        }
        L.geoJSON({ type:"FeatureCollection", features:feats }, {
          style: () => ({ color:c.color, weight:c.peso || 1.2, opacity:c.opacidad || .8,
                          fillColor:c.color, fillOpacity:(c.tipo === "poligono" ? .3 : .12) }),
          onEachFeature: (f, layer) => {
            elementos[c.id].push(layer);
            layer.on("click", e => { abrirFicha(f.properties, c, e.latlng); L.DomEvent.stopPropagation(e); });
          }
        }).addTo(capas[c.id]);
      }
      estado();
    })
    .catch(e => {
      const el = document.getElementById("n-" + c.id);
      if (el) el.textContent = "—";
      console.warn("capa no disponible:", c.id, e.message);
    });
}
CAPAS.forEach(c => { if (c.on) { capas[c.id].addTo(mapa); cargar(c); } });

document.querySelectorAll("[data-capa]").forEach(chk => {
  chk.addEventListener("change", e => {
    const id = e.target.dataset.capa;
    if (e.target.checked) { cargar(CAPAS.find(x => x.id === id)); capas[id].addTo(mapa); }
    else mapa.removeLayer(capas[id]);
    estado();
  });
});

/* al cambiar de zoom, re-agrupar los puntos visibles (barato: solo los cargados) */
let pendiente = null;
mapa.on("zoomend", () => {
  const z = mapa.getZoom();
  clearTimeout(pendiente);
  pendiente = setTimeout(() => {
    CAPAS.forEach(c => {
      if (c.tipo !== "punto" || !c.__cargada || c.siempreIndividual) return;
      if (!document.querySelector(`[data-capa="${c.id}"]`)?.checked) return;
      // re-agrupar solo al cambiar de nivel entero: dentro del mismo nivel la celda es la misma
      const antes = Math.floor(c.__zPintado === undefined ? -99 : c.__zPintado);
      const ahora = Math.floor(z);
      const cruzaDetalle = (c.__zPintado < ZOOM_DETALLE) !== (z < ZOOM_DETALLE);
      if (antes !== ahora || cruzaDetalle) pintarPuntos(c);
    });
  }, 160);
});

let temporizador = null;
cajaQ.addEventListener("input", () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    const t = cajaQ.value.trim().toLowerCase();
    if (t.length < 2) { cajaR.classList.remove("on"); cajaR.innerHTML = ""; return; }
    const vistos = new Set();
    const hits = [];
    for (const it of INDICE) {
      if (vistos.has(it.nombre + it.capa)) continue;
      if (it.nombre.toLowerCase().includes(t)) {
        vistos.add(it.nombre + it.capa);
        hits.push(it);
        if (hits.length >= 9) break;
      }
    }
    cajaR.innerHTML = hits.length ? hits.map((h, i) =>
      `<div data-hit="${i}">${h.nombre}<span>${h.capa}</span></div>`).join("")
      : '<div style="color:var(--tenue)">Sin resultados en las capas cargadas</div>';
    cajaR.classList.add("on");
    cajaR.querySelectorAll("[data-hit]").forEach(d => {
      d.addEventListener("click", () => {
        const h = hits[+d.dataset.hit];
        const def = CAPAS.find(x => x.id === h.capa);
        mapa.setView([h.lat, h.lng], Math.max(mapa.getZoom(), 11));
        setTimeout(() => abrirFicha(h.props, def, [h.lat, h.lng]), 260);
        cajaR.classList.remove("on");
      });
    });
  }, 140);
});

      <td>${act}</td>
      <td><span class="lic">${f.licencia || "—"}</span></td>
      <td class="c">${n ? n.toLocaleString("es-ES") : "—"}</td></tr>`;
  }).join("");
  tabla.innerHTML = filas;
  // al pinchar una fila se despliega la cadena de procedencia
  tabla.querySelectorAll("tr.fila-f").forEach(tr => {
    tr.addEventListener("click", () => {
      const id = tr.dataset.f;
      const sig = tr.nextElementSibling;
      if (sig && sig.classList.contains("det")) { sig.remove(); return; }
      const f = (FUENTES.capas[id] || {});
      const cd = f.cadena || {};
      const fila = document.createElement("tr");
      fila.className = "det";
      fila.innerHTML = "<td colspan='5'><div class='cadena'>" +
        "<b>Produce el dato:</b> " + (cd.productor || "—") + "<br>" +
        "<b>Lo publica:</b> " + (cd.publica || "—") + "<br>" +
        "<b>Lo descarga:</b> " + (cd.consume || "—") + "<br>" +
        "<span class='fl'>Fecha del dato:</span> " + (f.fecha_dato || "no la declara") +
        " · <span class='fl'>publicación:</span> " + (f.fecha_publicacion || "—") +
        " · <span class='fl'>descarga:</span> " + (f.fecha_descarga || "—") +
        (cd.nota ? "<span class='nota'>" + cd.nota + "</span>" : "") +
        "</div></td>";
      tr.after(fila);
    });
  });
  $("#fuentes-nota").innerHTML =
    `Generado el <b>${FUENTES.generado}</b> desde los recibos de descarga. ` +
    `La columna «Actualizado» es la fecha que declara el editor del dato (no la de descarga). ` +
    `Las capas de OpenStreetMap no declaran fecha: se descargaron el ${FUENTES.generado}.` +
    (FUENTES.simplificacion ? ` Geometrías simplificadas a 0,0008° (~89 m) para el visor.` : "");
}
$("#btn-fuentes").addEventListener("click", () => { pintarFuentes(); $("#velo").classList.add("on"); });
$("#cerrar-fuentes").addEventListener("click", () => $("#velo").classList.remove("on"));
$("#velo").addEventListener("click", e => { if (e.target.id === "velo") $("#velo").classList.remove("on"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#velo").classList.remove("on"); $("#velo2").classList.remove("on"); } });

/* ---------------- generación del día (API REE) ---------------- */
function pintarSis() {
  fetch("datos/ree_estado.json").then(r => r.json()).then(d => {
    const gen = (d.series && d.series.generacion) || [];
    const total = (gen.find(x => x.titulo.toLowerCase().startsWith("generación total")) || {}).valor || 0;
    const filas = gen.filter(x => !x.titulo.toLowerCase().startsWith("generación total"))
      .sort((a, b) => b.valor - a.valor);
    const max = filas.length ? filas[0].valor : 1;
    $("#sis-barras").innerHTML = filas.map(x => {
      const pct = total ? (100 * x.valor / total) : 0;
      const neg = x.valor < 0;
      const ancho = neg ? 3 : Math.max(2, (x.valor / max) * 300);
      return `<div class="barra"><span class="n">${x.titulo}</span>` +
        `<span class="b" style="width:${ancho}px;background:${neg ? "#4a5c70" : (x.color || "#22d3ee")}"></span>` +
        `<span class="v">${nf(x.valor)} MWh</span>` +
        `<span class="p">${neg ? "consumo propio" : pct.toFixed(1) + "%"}</span></div>`;
    }).join("");
    $("#sis-nota").innerHTML = `Día <b>${d.fecha}</b> · total <b>${nf(total)} MWh</b> · ` +
      `fuente: REE apidatos (sin clave). La API pública solo sirve <b>agregados diarios</b>: ` +
      `el tiempo real (horario o cada 5 minutos) devuelve error 400 hoy. ` +
      `Para generación por planta o previsión hace falta token de ENTSO-E o ESIOS.`;
  }).catch(() => { $("#sis-nota").textContent = "No se pudo cargar datos/ree_estado.json"; });
}
$("#btn-estado").addEventListener("click", () => { pintarSis(); $("#velo2").classList.add("on"); });
$("#cerrar-sis").addEventListener("click", () => $("#velo2").classList.remove("on"));
$("#velo2").addEventListener("click", e => { if (e.target.id === "velo2") $("#velo2").classList.remove("on"); });

/* ---------------- opacidad global ---------------- */
$("#op").addEventListener("input", e => {
  const v = e.target.value;
  $("#opv").textContent = v + "%";
  const pane = mapa.getPane("overlayPane");
  if (pane) pane.style.opacity = v / 100;
});

/* ---------------- enlace permanente ---------------- */
function estadoUrl() {
  const c = mapa.getCenter();
  const activas = CAPAS.filter(x => document.querySelector(`[data-capa="${x.id}"]`)?.checked).map(x => x.id);
  return "#z=" + mapa.getZoom().toFixed(2) + "&lat=" + c.lat.toFixed(4) + "&lng=" + c.lng.toFixed(4) +
         "&c=" + activas.join(",") + "&b=" + (document.documentElement.dataset.base || "radar") +
         "&t=" + (document.documentElement.dataset.tema || "oscuro");
}
$("#btn-enlace").addEventListener("click", async () => {
  const url = location.origin + location.pathname + estadoUrl();
  try { await navigator.clipboard.writeText(url); $("#btn-enlace").textContent = "✓"; }
  catch (e) { prompt("Copia el enlace:", url); }
  setTimeout(() => { $("#btn-enlace").textContent = "⧉"; }, 1600);
});

function aplicarUrl() {
  if (!location.hash || location.hash.length < 4) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  const z = parseFloat(p.get("z")), lat = parseFloat(p.get("lat")), lng = parseFloat(p.get("lng"));
  if (isFinite(lat) && isFinite(lng)) mapa.setView([lat, lng], isFinite(z) ? z : mapa.getZoom());
  const c = p.get("c");
  if (c) {
    const quiere = new Set(c.split(",").filter(Boolean));
    CAPAS.forEach(x => {
      const chk = document.querySelector(`[data-capa="${x.id}"]`);
      const on = quiere.has(x.id);
      if (!chk || chk.checked === on) return;
      chk.checked = on;
      if (on) { cargar(x); capas[x.id].addTo(mapa); } else mapa.removeLayer(capas[x.id]);
    });
    estado();
  }
  const b = p.get("b"), t = p.get("t");
  if (b) { sel.value = b; ponerBase(b); }
  if (t) document.documentElement.dataset.tema = t;
  return true;
}

/* ---------------- presets ---------------- */
document.querySelectorAll("[data-preset]").forEach(btn => {
  btn.addEventListener("click", () => {
    const p = btn.dataset.preset;
    document.querySelectorAll("[data-preset]").forEach(b => b.classList.toggle("on", b === btn));
    CAPAS.forEach(c => {
      const SOLO_PRESET = { "Agua": new Set(["embalses", "desaladoras", "trasvases"]) };
      const on = (p === "todos") ? true
        : (SOLO_PRESET[p] ? SOLO_PRESET[p].has(c.id) : (c.grupo === p));
      const chk = document.querySelector('[data-capa="' + c.id + '"]');
      if (!chk || chk.checked === on) return;
      chk.checked = on;
      if (on) { cargar(c); capas[c.id].addTo(mapa); } else mapa.removeLayer(capas[c.id]);
    });
    estado();
  });
});

aplicarUrl();

/* ---------------- API ---------------- */
window.OpenInfraES = {
  abrir(capaId, i = 0, zoom = 11) {
    if (!capas[capaId]) return "sin capa";
    const chk = document.querySelector('[data-capa="' + capaId + '"]');
    if (chk && !chk.checked) { chk.checked = true; capas[capaId].addTo(mapa); estado(); }
    const def = CAPAS.find(x => x.id === capaId);
    if (def) cargar(def);
    const intentar = (n) => {
      const ls = elementos[capaId] || [];
      if (!ls.length) { if (n > 0) return setTimeout(() => intentar(n - 1), 350); return "capa vacia"; }
      const l = ls[i] || ls[0];
      const centro = l.getLatLng ? l.getLatLng() : (l.getBounds ? l.getBounds().getCenter() : null);
      if (centro) mapa.setView(centro, zoom);
      const p = datos[capaId] ? (datos[capaId][i] || datos[capaId][0]).properties : l.feature.properties;
      abrirFicha(p, def, centro);
      return "ok";
    };
    return intentar(20);
  },
  capas: () => ({ ...conteo }),
  zoom: () => mapa.getZoom(),
  // fps medido en un arrastre real
  bench(ms = 2200) {
    return new Promise(res => {
      let f = 0; const t0 = performance.now();
      const contar = () => {
        f++;
        if (performance.now() - t0 < ms) requestAnimationFrame(contar);
        else res({ fps: Math.round(f / ((performance.now() - t0) / 1000)), frames:f });
      };
      mapa.panBy([600, 0], { animate: true, duration: ms / 1000 });
      requestAnimationFrame(contar);
    });
  }
};
