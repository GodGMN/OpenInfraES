<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infraestructura energética e hidráulica de España — OpenInfraES</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --tinta:#0f1c2e; --suave:#5a6b80; --borde:#e3e8ef; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:"Segoe UI", Inter, Arial, sans-serif; color:var(--tinta); }
  #mapa { position:absolute; inset:0; background:#eef2f6; }
  #panel { position:absolute; z-index:1000; top:14px; left:14px; width:312px; max-height:calc(100% - 28px);
           overflow:auto; background:#fff; border:1px solid var(--borde); border-radius:12px;
           padding:14px 15px; box-shadow:0 6px 24px rgba(15,28,46,.10); font-size:12.8px; }
  #panel h1 { margin:0 0 2px; font-size:15.5px; letter-spacing:-.2px; }
  #panel .sub { color:var(--suave); font-size:11.3px; margin-bottom:9px; line-height:1.35; }
  fieldset { border:0; border-top:1px solid var(--borde); margin:8px 0 0; padding:7px 0 0; }
  legend { font-size:10.3px; text-transform:uppercase; letter-spacing:1.1px; color:var(--suave); padding:0 4px 0 0; }
  label { display:flex; align-items:center; gap:7px; padding:2.2px 0; cursor:pointer; }
  label .n { margin-left:auto; color:#8fa0b5; font-size:10.8px; font-variant-numeric:tabular-nums; }
  .sw { width:12px; height:12px; border-radius:3px; flex:0 0 auto; }
  .sw.linea { height:4px; border-radius:2px; }
  .sw.poli { border:1.5px solid currentColor; background:transparent; }
  #cifras { margin-top:9px; padding-top:8px; border-top:1px solid var(--borde); color:var(--suave);
            font-size:11.2px; line-height:1.5; }
  #cifras b { color:var(--tinta); }
  .leaflet-popup-content { font-size:12.4px; line-height:1.45; margin:10px 12px; }
  .leaflet-popup-content b { display:block; margin-bottom:2px; }
  .leaflet-popup-content small { color:#5a6b80; }
  select { width:100%; padding:5px 6px; border:1px solid var(--borde); border-radius:7px;
           font-family:inherit; font-size:12px; color:var(--tinta); background:#fbfcfe; }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="panel">
  <h1>Infraestructura de España</h1>
  <div class="sub">Red eléctrica, gas, nuclear y agua. Cartografía: IGN. Datos: OSM · REE · Atlas Estratégico.</div>
  <fieldset>
    <legend>Cartografía base</legend>
    <select id="base">
      <option value="IGNBaseTodo">Mapa base IGN</option>
      <option value="IGNBase-gris">Mapa base IGN (gris)</option>
      <option value="IGNBaseOrto">Ortofoto (PNOA)</option>
      <option value="ign-nofondo">IGN sin fondo</option>
      <option value="osm">OpenStreetMap</option>
    </select>
  </fieldset>
  <div id="grupos"></div>
  <div id="cifras">Cargando capas…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------------- cartografía IGN ---------------- */
const IGN = (capa, fmt) =>
  "https://www.ign.es/wmts/ign-base?request=GetTile&service=WMTS&version=1.0.0&layer=" + capa +
  "&style=default&tilematrixset=GoogleMapsCompatible&tilematrix={z}&tilerow={y}&tilecol={x}&format=" + fmt;

const BASES = {
  IGNBaseTodo:    { url: IGN("IGNBaseTodo","image/png"),         attr:"© IGN España — Mapa Base" },
  "IGNBase-gris": { url: IGN("IGNBase-gris","image/png"),        attr:"© IGN España — Mapa Base" },
  IGNBaseOrto:    { url: IGN("IGNBaseOrto","image/jpeg"),        attr:"© IGN España — PNOA" },
  "ign-nofondo":  { url: IGN("IGNBaseTodo-nofondo","image/png"), attr:"© IGN España" },
  osm:            { url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", attr:"© OpenStreetMap" }
};

const mapa = L.map("mapa", { zoomControl:true, preferCanvas:true, minZoom:5 }).setView([40.2,-3.6], 7);
let capaBase = null;
function ponerBase(k) {
  const b = BASES[k] || BASES.IGNBaseTodo;
  if (capaBase) mapa.removeLayer(capaBase);
  capaBase = L.tileLayer(b.url, { attribution: b.attr + " · datos: OSM / REE / Atlas Estratégico",
    maxNativeZoom:18, maxZoom:19, crossOrigin:true }).addTo(mapa);
  capaBase.bringToBack();
}
ponerBase("IGNBaseTodo");
document.getElementById("base").addEventListener("change", e => ponerBase(e.target.value));

/* ---------------- definición de capas ---------------- */
const nf = n => n.toLocaleString("es-ES");

function popupGenerico(p, extra) {
  let h = "<b>" + (p.nombre || p.name || "sin nombre") + "</b>";
  if (p.categoria) h += p.categoria;
  if (p.operador) h += (p.categoria ? " · " : "") + p.operador;
  if (p.municipio) h += "<br>" + p.municipio;
  if (p.descripcion) h += "<br><small>" + String(p.descripcion).slice(0,140) + "</small>";
  if (p.estado_registro) h += "<br><small>registro: " + p.estado_registro + "</small>";
  return h + (extra || "");
}

const CAPAS = [
  // ---- red eléctrica
  { id:"l400", grupo:"Red eléctrica", label:"400 kV", tipo:"linea", on:true, color:"#b91c1c",
    fichero:"datos/lineas_hv.geojson", peso:2.2, opacidad:.9,
    filtro:f => f.properties.voltage === 400000,
    popup:p => "<b>" + (p.name || "Línea 400 kV") + "</b>400 kV · " + (p.line_type||"") + "<br>" + (p.operator||"sin operador") },
  { id:"l220", grupo:"Red eléctrica", label:"220 kV", tipo:"linea", on:true, color:"#1d4ed8",
    fichero:"datos/lineas_hv.geojson", peso:1.4, opacidad:.75,
    filtro:f => f.properties.voltage === 220000,
    popup:p => "<b>" + (p.name || "Línea 220 kV") + "</b>220 kV · " + (p.line_type||"") + "<br>" + (p.operator||"sin operador") },
  { id:"subestaciones", grupo:"Red eléctrica", label:"Subestaciones (Atlas)", tipo:"poligono", on:false, color:"#0f766e",
    fichero:"datos/atlas/red-electrica.geojson", peso:1, popup:popupGenerico,
    filtro:f => f.properties.categoria === "subestacion" },
  { id:"tendidos", grupo:"Red eléctrica", label:"Tendidos IGN", tipo:"linea", on:false, color:"#115e59",
    fichero:"datos/atlas/red-electrica.geojson", peso:1.6, opacidad:.85, popup:popupGenerico,
    filtro:f => f.properties.categoria === "tendido" },
  { id:"inter-elec", grupo:"Red eléctrica", label:"Interconexiones", tipo:"punto", on:false, color:"#7c2d12",
    fichero:"datos/atlas/electricidad-interconexiones.geojson", radio:6, popup:popupGenerico },

  // ---- generación
  { id:"hidro", grupo:"Generación", label:"Hidráulicas", tipo:"punto", on:true, color:"#0891b2",
    fichero:"datos/plantas.geojson", magnitud:"installed_capacity_mw",
    filtro:f => ["hydro","pumped_hydro"].includes(f.properties.technology_normalized),
    popup:p => "<b>" + (p.name||"") + "</b>" + (p.technology_normalized||"") + " · " + nf(Math.round(p.installed_capacity_mw||0)) + " MW<br>" + (p.municipality||"") },
  { id:"gasgen", grupo:"Generación", label:"Gas (CCGT)", tipo:"punto", on:false, color:"#7c3aed",
    fichero:"datos/plantas.geojson", magnitud:"installed_capacity_mw",
    filtro:f => ["ccgt","fuel_gas"].includes(f.properties.technology_normalized),
    popup:p => "<b>" + (p.name||"") + "</b>" + (p.technology_normalized||"") + " · " + nf(Math.round(p.installed_capacity_mw||0)) + " MW<br>" + (p.municipality||"") },
  { id:"nuclear", grupo:"Generación", label:"Nuclear", tipo:"punto", on:true, color:"#6c5ce7",
    fichero:"datos/atlas/nuclear.geojson", radio:7, popup:popupGenerico },
  { id:"resto", grupo:"Generación", label:"Resto del parque", tipo:"punto", on:false, color:"#16a34a",
    fichero:"datos/plantas.geojson", magnitud:"installed_capacity_mw",
    filtro:f => !["hydro","pumped_hydro","ccgt","fuel_gas"].includes(f.properties.technology_normalized),
    popup:p => "<b>" + (p.name||"") + "</b>" + (p.technology_normalized||"") + " · " + nf(Math.round(p.installed_capacity_mw||0)) + " MW" },

  // ---- gas
  { id:"gasoductos", grupo:"Gas", label:"Gasoductos (OSM)", tipo:"linea", on:true, color:"#a16207",
    fichero:"datos/gasoductos.geojson", peso:1.5, opacidad:.8, popup:popupGenerico },
  { id:"conducciones", grupo:"Gas", label:"Conducciones (Atlas)", tipo:"linea", on:false, color:"#78350f",
    fichero:"datos/atlas/conducciones-combustible.geojson", peso:1.8, opacidad:.85, popup:popupGenerico },
  { id:"regas", grupo:"Gas", label:"Regasificadoras", tipo:"punto", on:true, color:"#b45309",
    fichero:"datos/atlas/gas-regasificacion.geojson", radio:6, popup:popupGenerico },
  { id:"gasalm", grupo:"Gas", label:"Almacenamiento de gas", tipo:"punto", on:false, color:"#92400e",
    fichero:"datos/atlas/gas-almacenamiento.geojson", radio:5, popup:popupGenerico },
  { id:"refinerias", grupo:"Gas", label:"Refinerías", tipo:"punto", on:false, color:"#57534e",
    fichero:"datos/atlas/refinerias.geojson", radio:5, popup:popupGenerico },

  // ---- agua
  { id:"desaladoras", grupo:"Agua", label:"Desaladoras (Atlas)", tipo:"punto", on:true, color:"#0e7490",
    fichero:"datos/atlas/desaladoras.geojson", radio:5, popup:popupGenerico },
  { id:"embalses", grupo:"Agua", label:"Embalses (Atlas)", tipo:"punto", on:false, color:"#0369a1",
    fichero:"datos/atlas/agua-embalsada.geojson", radio:3.2, popup:popupGenerico },
  { id:"presas", grupo:"Agua", label:"Presas (OSM)", tipo:"punto", on:false, color:"#64748b",
    fichero:"datos/presas.geojson", radio:2.6, popup:popupGenerico },

  // ---- hidrógeno
  { id:"h2", grupo:"Hidrógeno", label:"Producción H₂", tipo:"punto", on:false, color:"#0f766e",
    fichero:"datos/atlas/hidrogeno-produccion.geojson", radio:5, popup:popupGenerico }
];

/* ---------------- motor ---------------- */
const grupos = {}, capas = {}, conteo = {};
CAPAS.forEach(c => {
  if (!grupos[c.grupo]) grupos[c.grupo] = [];
  grupos[c.grupo].push(c);
  capas[c.id] = L.layerGroup();
  if (c.on) capas[c.id].addTo(mapa);
  conteo[c.id] = 0;
});

const panel = document.getElementById("grupos");
Object.entries(grupos).forEach(([nombre, lista]) => {
  const fs = document.createElement("fieldset");
  fs.innerHTML = "<legend>" + nombre + "</legend>" + lista.map(c =>
    `<label><input type="checkbox" data-capa="${c.id}" ${c.on ? "checked" : ""}>` +
    `<span class="sw ${c.tipo === "linea" ? "linea" : c.tipo === "poligono" ? "poli" : ""}" ` +
    `style="background:${c.tipo === "poligono" ? "transparent" : c.color};color:${c.color};` +
    `${c.tipo === "linea" ? "background:" + c.color : ""}"></span>${c.label}` +
    `<span class="n" id="n-${c.id}"></span></label>`
  ).join("");
  panel.appendChild(fs);
});

function radioDe(c, p) {
  if (c.magnitud) return Math.max(2, Math.min(9, Math.sqrt(p[c.magnitud] || 0) / 1.8));
  return c.radio || 4.5;
}

CAPAS.forEach(c => {
  fetch(c.fichero).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(gj => {
      const feats = c.filtro ? gj.features.filter(c.filtro) : gj.features;
      // L.geoJSON maneja Point, MultiPoint, LineString, MultiLineString, Polygon y MultiPolygon
      L.geoJSON({ type:"FeatureCollection", features:feats }, {
        pointToLayer: (f, latlng) => L.circleMarker(latlng, {
          radius: radioDe(c, f.properties || {}),
          fillColor: c.color, fillOpacity: .72, color: "#fff", weight: .7
        }),
        style: () => ({ color: c.color, weight: c.peso || 1.3, opacity: c.opacidad || .8,
                        fillColor: c.color, fillOpacity: (c.tipo === "poligono" ? .35 : .18) }),
        onEachFeature: (f, layer) => layer.bindPopup(c.popup(f.properties || {}))
      }).addTo(capas[c.id]);
      conteo[c.id] = feats.length;
      const el = document.getElementById("n-" + c.id);
      if (el) el.textContent = nf(conteo[c.id]);
      pintarCifras();
    })
    .catch(e => {
      const el = document.getElementById("n-" + c.id);
      if (el) el.textContent = "—";
      console.warn("capa no disponible:", c.id, e.message);
    });
});

document.querySelectorAll("[data-capa]").forEach(chk => {
  chk.addEventListener("change", e => {
    const id = e.target.dataset.capa;
    e.target.checked ? capas[id].addTo(mapa) : mapa.removeLayer(capas[id]);
    pintarCifras();
  });
});

function pintarCifras() {
  const el = document.getElementById("cifras");
  const vis = CAPAS.filter(c => document.querySelector(`[data-capa="${c.id}"]`)?.checked && conteo[c.id]);
  if (!vis.length) { el.textContent = "Sin capas activas."; return; }
  el.innerHTML = vis.slice(0, 9).map(c => "<b>" + nf(conteo[c.id]) + "</b> " + c.label.toLowerCase()).join(" · ");
}
</script>
</body>
</html>
